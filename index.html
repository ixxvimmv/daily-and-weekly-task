<!DOCTYPE html>
<html lang="en" data-accent="pink" data-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffe4ec">
  <title>Daily &amp; Weekly Task Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <!-- Loaded early so the saved theme is applied before the page paints -->
  <script src="js/storage.js"></script>
  <script src="js/settings.js"></script>
</head>
<body>
  <a class="skip-link" href="#task-list">Skip to tasks</a>

  <div class="app-layout">
    <main class="container">
      <header class="top-bar">
        <h1>Daily &amp; Weekly Task Tracker</h1>
        <div class="top-actions">
          <select id="accent-select" aria-label="Color theme">
            <option value="pink">Pink</option>
            <option value="blue">Blue</option>
            <option value="green">Green</option>
            <option value="purple">Purple</option>
          </select>
          <button type="button" class="btn btn-muted" id="mode-btn"></button>
          <button type="button" class="btn btn-muted" id="export-btn">Export</button>
          <button type="button" class="btn btn-muted" id="import-btn">Import</button>
          <input type="file" id="import-file" accept="application/json,.json" hidden>
        </div>
      </header>

      <nav class="tabs" id="tabs" role="tablist" aria-label="Days of the week"></nav>

      <section id="panel" class="task-section" role="tabpanel" aria-labelledby="panel-title">
        <div class="panel-header">
          <h2 id="panel-title"></h2>
          <span class="counter" id="panel-counter"></span>
        </div>

        <div class="progress" aria-hidden="true">
          <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="filter-note" id="filter-note" hidden>
          <span id="filter-text"></span>
          <button type="button" class="btn btn-muted btn-small" id="clear-filter">Show day view</button>
        </div>

        <div class="toolbar">
          <input type="search" id="search-input" placeholder="Search all days..." aria-label="Search tasks across all days" autocomplete="off">
          <select id="status-filter" aria-label="Filter by status">
            <option value="all">All</option>
            <option value="active">Active</option>
            <option value="done">Done</option>
          </select>
          <select id="sort-select" aria-label="Sort tasks">
            <option value="manual">Manual order</option>
            <option value="due">Due date</option>
            <option value="priority">Priority</option>
          </select>
        </div>

        <div class="celebrate" id="celebrate" hidden>🎉 All done — nice work! 🎉</div>

        <ul class="task-list" id="task-list"></ul>
        <p class="empty" id="empty-msg" hidden></p>

        <form class="task-form" id="task-form" autocomplete="off">
          <input type="text" id="task-input" placeholder="Add a task..." aria-label="New task" maxlength="200">
          <div class="form-row">
            <label>Due <input type="date" id="due-input"></label>
            <label>Priority
              <select id="priority-input">
                <option value="none">None</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
              </select>
            </label>
            <label class="check"><input type="checkbox" id="recurring-input"> Repeat weekly</label>
          </div>
          <div class="form-buttons">
            <button type="submit" class="btn">Add task</button>
            <button type="button" class="btn btn-muted" id="clear-done">Clear done</button>
            <button type="button" class="btn btn-muted" id="clear-all">Clear all</button>
          </div>
        </form>
      </section>
    </main>

    <aside class="calendar" aria-label="Calendar">
      <div class="calendar-header">
        <h3><button type="button" class="cal-title" id="calendar-title" title="Jump to the current month"></button></h3>
        <div class="calendar-nav">
          <button type="button" class="btn btn-muted btn-small" id="prev-month" aria-label="Previous month">&lt;</button>
          <button type="button" class="btn btn-muted btn-small" id="next-month" aria-label="Next month">&gt;</button>
          <button type="button" class="btn btn-muted btn-small" id="calendar-toggle" aria-expanded="true" aria-label="Collapse calendar">&minus;</button>
        </div>
      </div>
      <p class="clock" id="time"></p>
      <div id="calendar-content">
        <table>
          <thead>
            <tr><th>Su</th><th>Mo</th><th>Tu</th><th>We</th><th>Th</th><th>Fr</th><th>Sa</th></tr>
          </thead>
          <tbody id="calendar-body"></tbody>
        </table>
        <p class="calendar-hint">Click a date to see the tasks due that day.</p>
      </div>
    </aside>
  </div>

  <div class="toast" id="toast" hidden>
    <span id="toast-text"></span>
    <button type="button" class="btn btn-muted btn-small" id="toast-undo">Undo</button>
  </div>
  <div class="sr-only" id="status" aria-live="polite"></div>

  <script src="js/tasks.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
